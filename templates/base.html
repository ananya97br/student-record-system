{% load static %}

<html lang="en">

  <meta name="description" content="Student Record System portal">
  <title>{% block title %}Student Record System{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">

</head>
<body>

</body>
</html>
