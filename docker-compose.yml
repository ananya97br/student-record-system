services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: student_records
      MYSQL_USER: student
      MYSQL_PASSWORD: student_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ustudent", "-pstudent_password"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://student:student_password@db:3306/student_records
      APP_BASE_URL: http://localhost:8000
      DOCUMENT_STORAGE_PATH: /app/var/documents
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DJANGO_DEBUG: "0"
      SECURE_COOKIES: "0"
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,api,web,proxy
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - document_data:/app/var/documents
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-", "--error-logfile", "-"]

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://student:student_password@db:3306/student_records
      APP_BASE_URL: http://localhost:8000
      DOCUMENT_STORAGE_PATH: /app/var/documents
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      DJANGO_DEBUG: "0"
      SECURE_COOKIES: "0"
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      ALLOWED_HOSTS: localhost,127.0.0.1,api,web,proxy
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - document_data:/app/var/documents
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "3", "--access-logfile", "-", "--error-logfile", "-"]

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  mysql_data:
  document_data:
