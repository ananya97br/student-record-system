name: CI and GHCR publish

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Django checks and tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-only-django-secret-key-with-sufficient-length
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CSRF_TRUSTED_ORIGINS: http://localhost:8000
      DATABASE_URL: mysql://student:student_password@127.0.0.1:3306/student_records
      FIELD_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      LOOKUP_HMAC_KEY: ci-only-lookup-hmac-key-with-sufficient-length
      JWT_SECRET_KEY: ci-only-jwt-secret-key-with-sufficient-length
      PAYMENT_MOCK_HMAC_SECRET: ci-only-payment-hmac-secret-with-sufficient-length
      APP_BASE_URL: http://127.0.0.1:8000
      EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
      DOCUMENT_STORAGE_PATH: var/documents
      MALWARE_SCANNER: deterministic
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: student_records
          MYSQL_USER: student
          MYSQL_PASSWORD: student_password
          MYSQL_ROOT_PASSWORD: root_password_for_ci_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --protocol=TCP -h 127.0.0.1 -u student -pstudent_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Prepare report directory
        run: mkdir -p docs/reports

      - name: Configure MySQL for audit triggers
        env:
          MYSQL_ROOT_PASSWORD: root_password_for_ci_only
        run: |
          python - <<'PY'
          import os
          import pymysql

          connection = pymysql.connect(
              host="127.0.0.1",
              port=3306,
              user="root",
              password=os.environ["MYSQL_ROOT_PASSWORD"],
              autocommit=True,
          )
          try:
              with connection.cursor() as cursor:
                  cursor.execute("SET GLOBAL log_bin_trust_function_creators = 1")
                  cursor.execute("CREATE DATABASE IF NOT EXISTS test_student_records")
                  cursor.execute("GRANT ALL PRIVILEGES ON test_student_records.* TO 'student'@'%'")
          finally:
              connection.close()
          PY

      - name: Run Django system checks
        run: python manage.py check

      - name: Apply database migrations
        run: python manage.py migrate --noinput

      - name: Run automated tests with line and branch coverage
        run: >-
          coverage run --branch --source=. -m pytest
          --junitxml=docs/reports/unit-test-report.xml
          -q

      - name: Generate coverage reports
        if: always()
        run: |
          if [ -f .coverage ]; then
            coverage report --show-missing | tee docs/reports/coverage-report.txt
            coverage report --show-missing > docs/reports/branch-coverage-report.txt
            coverage xml -o docs/reports/coverage.xml
            coverage json -o docs/reports/coverage.json --pretty-print
            coverage html -d docs/reports/coverage-html
          else
            printf '%s\n' 'Coverage data was not produced because the test command did not start.' > docs/reports/coverage-report.txt
            cp docs/reports/coverage-report.txt docs/reports/branch-coverage-report.txt
          fi

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: docs/reports
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Build and publish Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
