upstream srs_api { server api:8000; }
upstream srs_web { server web:8000; }

server {
    # The reverse proxy is the single public entry point; TLS can terminate at
    # the deployment edge while these internal upstreams remain private.
    listen 80;
    server_name _;
    # Keep baseline browser protections at the proxy boundary for both routes.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://srs_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }
    location / {
        proxy_pass http://srs_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
