[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "student-record-system"
version = "1.0.0"
description = "A complete Django Student Record System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16,<4.0",
    "PyJWT>=2.9,<3.0",
    "argon2-cffi>=23.1,<26.0",
    "cryptography>=43.0,<47.0",
    "openpyxl>=3.1,<4.0",
    "reportlab>=4.2,<5.0",
    "Pillow>=10.4,<13.0",
    "PyMySQL>=1.1,<2.0",
    "gunicorn>=23.0,<24.0",
    "python-dotenv>=1.0,<2.0",
    "whitenoise>=6.8,<7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "coverage>=7.6,<8.0",
]
e2e = ["playwright>=1.48,<2.0"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "-ra"
